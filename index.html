<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#1c1f26;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#23262f;
  width:360px;
  padding:25px;
  border-radius:14px;
}
h2{text-align:center;}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  background:#2f3340;
  color:white;
}
button{
  width:100%;
  padding:12px;
  background:#2a7cff;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.small{text-align:center;font-size:13px;color:#ccc;margin-top:12px;}
</style>
</head>
<body>

<div class="box">
  <h2>تسجيل الدخول</h2>

  <form action="" method="POST">
    <input type="text" name="username" placeholder="اسم المستخدم أو البريد الإلكتروني" required>
    <input type="password" name="password" placeholder="كلمة المرور" required>
    <button type="submit">تسجيل الدخول</button>
  </form>

  <div class="small">ليس لديك حساب؟ أنشئ حسابًا جديدًا</div>
</div>

</body>
</html>
